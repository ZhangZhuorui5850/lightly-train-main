# 易混层级 / 同义组表
# 用于冲突检测：同组内 sibling 类别高 IoU 同框 → conflict
# 关系类型：parent_child（合法同框）/ sibling（同框可疑）/ part_of（部件-整体，不报）
#
# 格式：
#   - group: 组名
#     relation: sibling | parent_child | part_of
#     classes: [类名1, 类名2, ...]
#
# 通用规则：
#   - parent_child 同框不报（如 "车辆" + "suv"）
#   - part_of 同框不报（如 "飞机" + "机翼"）
#   - sibling 同框高 IoU → conflict（如 "suv" + "轿车"）

# ============================================================
# COCO 80 类（默认）
# ============================================================
coco80:
  # 交通工具
  - group: "车辆"
    relation: sibling
    classes: ["car", "truck", "bus", "motorcycle", "bicycle"]

  - group: "水上交通"
    relation: sibling
    classes: ["boat", "surfboard", "kite"]

  - group: "空中交通"
    relation: sibling
    classes: ["airplane", "kite"]

  # 室内家具
  - group: "坐具"
    relation: sibling
    classes: ["chair", "couch", "bench", "bed"]

  - group: "桌面"
    relation: sibling
    classes: ["dining table", "desk"]

  # 食物
  - group: "水果"
    relation: sibling
    classes: ["banana", "apple", "orange"]

  - group: "快餐"
    relation: sibling
    classes: ["hot dog", "pizza", "sandwich", "donut", "cake"]

  # 餐具
  - group: "餐具"
    relation: sibling
    classes: ["fork", "knife", "spoon", "bowl", "cup", "wine glass"]

  # 电子产品
  - group: "电子设备"
    relation: sibling
    classes: ["laptop", "cell phone", "tv", "remote", "keyboard", "mouse"]

  - group: "家电"
    relation: sibling
    classes: ["microwave", "oven", "toaster", "refrigerator"]

  # 动物
  - group: "宠物"
    relation: sibling
    classes: ["cat", "dog"]

  - group: "家畜"
    relation: sibling
    classes: ["horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe"]

  # 配饰/包
  - group: "包类"
    relation: sibling
    classes: ["backpack", "handbag", "suitcase"]

  # 运动器材
  - group: "运动器材"
    relation: sibling
    classes: ["skis", "snowboard", "sports ball", "baseball bat", "baseball glove", "tennis racket", "skateboard", "surfboard"]

  # 卫浴
  - group: "卫浴"
    relation: sibling
    classes: ["toilet", "sink"]

  # 人 vs 人体部件（如果有的话）
  - group: "人"
    relation: parent_child
    classes: ["person"]

  # 瓶/杯
  - group: "容器"
    relation: sibling
    classes: ["bottle", "cup", "wine glass", "bowl"]

  # 刀具/剪刀
  - group: "利器"
    relation: sibling
    classes: ["knife", "scissors"]

  # 时钟/花瓶/书籍（装饰/文具类）
  - group: "装饰/文具"
    relation: sibling
    classes: ["clock", "vase", "book", "teddy bear"]

  # 交通标志
  - group: "交通设施"
    relation: sibling
    classes: ["traffic light", "fire hydrant", "stop sign", "parking meter"]


