# 易混层级 / 同义组表
# 用于冲突检测：同组内 sibling 类别高 IoU 同框 → conflict
# 关系类型：parent_child（合法同框）/ sibling（同框可疑）/ part_of（部件-整体，不报）
#
# 格式：
#   <dataset_key>:
#     - group: 组名
#       relation: sibling | parent_child | part_of
#       classes: [类名1, 类名2, ...]

# ============================================================
# COCO 80 类（默认）
# ============================================================
coco80:
  # 交通工具
  - group: "车辆"
    relation: sibling
    classes: ["car", "truck", "bus", "motorcycle", "bicycle"]

  - group: "水上交通"
    relation: sibling
    classes: ["boat", "surfboard"]

  - group: "空中交通"
    relation: sibling
    classes: ["airplane"]

  # 室内家具
  - group: "坐具"
    relation: sibling
    classes: ["chair", "couch", "bench"]

  # 食物
  - group: "水果"
    relation: sibling
    classes: ["banana", "apple", "orange"]

  - group: "快餐"
    relation: sibling
    classes: ["hot dog", "pizza", "sandwich", "donut", "cake"]

  # 餐具
  - group: "餐具"
    relation: sibling
    classes: ["fork", "knife", "spoon", "bowl", "cup", "wine glass"]

  # 电子产品
  - group: "电子设备"
    relation: sibling
    classes: ["laptop", "cell phone", "tv", "remote", "keyboard", "mouse"]

  - group: "家电"
    relation: sibling
    classes: ["microwave", "oven", "toaster", "refrigerator"]

  # 动物
  - group: "宠物"
    relation: sibling
    classes: ["cat", "dog"]

  - group: "家畜/大型动物"
    relation: sibling
    classes: ["horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe"]

  # 配饰/包
  - group: "包类"
    relation: sibling
    classes: ["backpack", "handbag", "suitcase"]

  # 运动器材
  - group: "冬季运动"
    relation: sibling
    classes: ["skis", "snowboard"]

  - group: "球类"
    relation: sibling
    classes: ["sports ball", "baseball bat", "baseball glove", "tennis racket"]

  - group: "板类运动"
    relation: sibling
    classes: ["skateboard", "surfboard"]

  # 卫浴
  - group: "卫浴"
    relation: sibling
    classes: ["toilet", "sink"]

  # 瓶/杯/容器
  - group: "容器"
    relation: sibling
    classes: ["bottle", "cup", "wine glass", "bowl"]

  # 刀具/利器
  - group: "利器"
    relation: sibling
    classes: ["knife", "scissors"]

  # 时钟/花瓶/书籍（装饰/文具类）
  - group: "装饰/文具"
    relation: sibling
    classes: ["clock", "vase", "book", "teddy bear"]

  # 交通标志
  - group: "交通设施"
    relation: sibling
    classes: ["traffic light", "fire hydrant", "stop sign", "parking meter"]

  # 人（parent_child 表示人 vs 人体部件合法同框）
  - group: "人"
    relation: parent_child
    classes: ["person"]

  # 伞/领带/围巾等配饰
  - group: "配饰"
    relation: sibling
    classes: ["umbrella", "tie"]

  # 室内场景
  - group: "室内家具"
    relation: sibling
    classes: ["bed", "dining table", "couch", "chair"]

  # 电子/遥控
  - group: "小型电子"
    relation: sibling
    classes: ["cell phone", "remote", "mouse"]
